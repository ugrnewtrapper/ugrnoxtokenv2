<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>UGR Poisson Future PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

  --bg:#0b0f15;
  --card:#121923;
  --card2:#0f141c;
  --line:rgba(255,255,255,0.08);

  --text:#f2f5f7;
  --muted:#94a3b8;

  --primary:#1f6feb;
  --primary2:#3b82f6;

  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;

}

*{

  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;

}

body{

  background:
  radial-gradient(circle at top, rgba(31,111,235,0.20), transparent 30%),
  linear-gradient(180deg,#080b10,var(--bg));

  color:var(--text);

  min-height:100vh;

  display:flex;

  justify-content:center;

  padding:30px 16px;

}

.container{

  width:100%;
  max-width:1100px;

}

.header{

  text-align:center;
  margin-bottom:25px;

}

.logo{

  width:90px;
  margin-bottom:10px;

}

.title{

  font-size:2.2rem;
  font-weight:800;

  background:linear-gradient(90deg,#fff,#6ea8ff);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

}

.subtitle{

  color:var(--muted);
  margin-top:8px;
  font-size:0.95rem;

}

.card{

  background:linear-gradient(180deg,var(--card),var(--card2));

  border:1px solid var(--line);

  border-radius:24px;

  padding:24px;

  box-shadow:
  0 10px 40px rgba(0,0,0,0.45);

}

.section-title{

  font-size:1rem;
  margin-bottom:14px;
  color:#dce7f8;
  font-weight:700;

}

.grid-2{

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:18px;

  margin-bottom:22px;

}

.grid-3{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:18px;

  margin-bottom:22px;

}

.input-box{

  background:#0b1017;

  border:1px solid var(--line);

  border-radius:18px;

  padding:16px;

}

.label{

  font-size:0.82rem;

  color:var(--muted);

  margin-bottom:10px;

  display:block;

}

.desc{

  font-size:0.74rem;

  color:#7f8ca3;

  margin-top:8px;

  line-height:1.4;

}

input,
select{

  width:100%;

  background:#091019;

  border:1px solid rgba(255,255,255,0.08);

  border-radius:12px;

  padding:14px;

  color:white;

  font-size:1rem;

  outline:none;

  transition:0.2s;

}

input:focus,
select:focus{

  border-color:var(--primary);

  box-shadow:0 0 0 3px rgba(31,111,235,0.15);

}

button{

  width:100%;

  padding:18px;

  border:none;

  border-radius:16px;

  background:linear-gradient(90deg,var(--primary),var(--primary2));

  color:white;

  font-size:1rem;

  font-weight:700;

  cursor:pointer;

  transition:0.2s;

}

button:hover{

  transform:translateY(-2px);

}

.result{

  margin-top:28px;

}

.result-grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:18px;

}

.result-box{

  background:#0a1119;

  border-radius:18px;

  padding:20px;

  transition:0.2s;

  overflow:hidden;

  position:relative;

}

.result-box:hover{

  transform:translateY(-3px);

}

.badge{

  display:inline-flex;

  align-items:center;

  gap:8px;

  padding:8px 14px;

  border-radius:999px;

  font-size:0.8rem;

  font-weight:700;

}

.green{

  background:rgba(34,197,94,0.12);

  color:var(--green);

}

.red{

  background:rgba(239,68,68,0.12);

  color:var(--red);

}

.yellow{

  background:rgba(245,158,11,0.12);

  color:var(--yellow);

}

.info{

  margin-top:18px;

  color:var(--muted);

  line-height:1.7;

  font-size:0.88rem;

}

.footer{

  text-align:center;

  margin-top:20px;

  color:#6b7280;

  font-size:0.78rem;

}

@media(max-width:950px){

  .grid-3{

    grid-template-columns:1fr;

  }

  .result-grid{

    grid-template-columns:1fr;

  }

}

@media(max-width:700px){

  .grid-2{

    grid-template-columns:1fr;

  }

  .title{

    font-size:1.7rem;

  }

  .card{

    padding:18px;

  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <img src="images/logodorei.png" class="logo">

    <div class="title">

      UGR POISSON FUTURE PRO

    </div>

    <div class="subtitle">

      Modelo Poisson Avançado • xG • EV Inteligente • Ajustes Contextuais

    </div>

  </div>

  <div class="card">

    <div class="section-title">

      Dados Principais do Jogo

    </div>

    <div class="grid-2">

      <div class="input-box">

        <label class="label">

          xG Time da Casa

        </label>

        <input id="homeXG" type="number" step="0.01" placeholder="Ex: 1.85">

        <div class="desc">

          Insira o xG ofensivo esperado do mandante.

        </div>

      </div>

      <div class="input-box">

        <label class="label">

          xG Time Visitante

        </label>

        <input id="awayXG" type="number" step="0.01" placeholder="Ex: 1.10">

        <div class="desc">

          Insira o xG ofensivo esperado do visitante.

        </div>

      </div>

    </div>

    <div class="section-title">

      Odds do Mercado

    </div>

    <div class="grid-3">

      <div class="input-box">

        <label class="label">

          Odd Casa (1)

        </label>

        <input id="odd1" type="number" step="0.01" placeholder="Ex: 1.95">

      </div>

      <div class="input-box">

        <label class="label">

          Odd Empate (X)

        </label>

        <input id="oddX" type="number" step="0.01" placeholder="Ex: 3.40">

      </div>

      <div class="input-box">

        <label class="label">

          Odd Visitante (2)

        </label>

        <input id="odd2" type="number" step="0.01" placeholder="Ex: 4.10">

      </div>

    </div>

    <div class="section-title">

      Ajustes Inteligentes (Opcional)

    </div>

    <div class="grid-3">

      <div class="input-box">

        <label class="label">

          Força Mandante

        </label>

        <input id="homeBoost" type="number" step="0.1" placeholder="0">

      </div>

      <div class="input-box">

        <label class="label">

          Desfalques Visitante

        </label>

        <input id="awayWeak" type="number" step="0.1" placeholder="0">

      </div>

      <div class="input-box">

        <label class="label">

          Motivação do Jogo

        </label>

        <select id="motivation">

          <option value="0">

            Normal

          </option>

          <option value="0.15">

            Alta

          </option>

          <option value="-0.10">

            Baixa

          </option>

        </select>

      </div>

    </div>

    <button onclick="calcular()">

      ANALISAR EV AVANÇADO

    </button>

    <div class="result" id="result"></div>

  </div>

</div>

<script>

function factorial(n){

  if(n <= 1) return 1;

  let r = 1;

  for(let i = 2; i <= n; i++){

    r *= i;

  }

  return r;

}

function poisson(lambda,k){

  return (

    Math.pow(lambda,k) *

    Math.exp(-lambda)

  ) / factorial(k);

}

function normalizeProbabilities(pH,pD,pA){

  let total = pH + pD + pA;

  return {

    pH: pH / total,

    pD: pD / total,

    pA: pA / total

  };

}

function calcProb(home,away){

  let max = 12;

  let pH = 0;

  let pD = 0;

  let pA = 0;

  for(let i = 0; i <= max; i++){

    for(let j = 0; j <= max; j++){

      let p =

      poisson(home,i) *

      poisson(away,j);

      if(i > j){

        pH += p;

      }

      else if(i === j){

        pD += p;

      }

      else{

        pA += p;

      }

    }

  }

  pD *= 1.12;

  return normalizeProbabilities(pH,pD,pA);

}

function getEV(prob,odd){

  return (prob * odd) - 1;

}

function getConfidence(ev){

  if(ev >= 0.12){

    return "ALTA";

  }

  if(ev >= 0.05){

    return "MODERADA";

  }

  return "BAIXA";

}

function marketProbability(odd){

  return 1 / odd;

}

function blendProbability(model,market){

  return (

    (model * 0.70) +

    (market * 0.30)

  );

}

function resultBox(title,prob,ev){

  let isPositive = ev > 0;

  return `

  <div class="result-box" style="
    border:${isPositive ? '1px solid rgba(34,197,94,0.35)' : '1px solid rgba(239,68,68,0.25)'};
    background:${isPositive ? '#07140d' : '#140707'};
  ">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    ">

      <div style="
        font-size:0.9rem;
        color:${isPositive ? '#22c55e' : '#ef4444'};
        font-weight:700;
      ">
        ${isPositive ? title : 'SEM EV+'}
      </div>

      <div style="
        font-size:2.3rem;
      ">
        ${isPositive ? '📈' : '📉'}
      </div>

    </div>

    ${
      isPositive
      ?
      `
      <div style="
        font-size:2rem;
        font-weight:800;
        color:#22c55e;
        margin-bottom:10px;
      ">
        ${(prob * 100).toFixed(2)}%
      </div>

      <div class="badge green">
        EV+
      </div>

      <div class="info">

        Resultado:
        <b>${title}</b><br><br>

        EV:
        <b>${(ev * 100).toFixed(2)}%</b><br><br>

        Confiança:
        <b>${getConfidence(ev)}</b>

      </div>
      `
      :
      `
      <div style="
        font-size:1.5rem;
        font-weight:800;
        color:#ef4444;
        margin-bottom:12px;
      ">
        MERCADO NEGATIVO
      </div>

      <div class="badge red">
        EV-
      </div>

      <div class="info">

        Nenhum valor esperado encontrado.

      </div>
      `
    }

    <div style="
      margin-top:18px;
      height:85px;
      border-radius:14px;
      overflow:hidden;
      background:#091019;
      border:1px solid rgba(255,255,255,0.05);
    ">

      <svg width="100%" height="100%" viewBox="0 0 300 85" preserveAspectRatio="none">

        ${
          isPositive
          ?
          `
          <polyline
            fill="none"
            stroke="#22c55e"
            stroke-width="4"
            points="
            0,75
            40,70
            80,62
            120,50
            160,42
            200,28
            240,16
            300,4
            "
          />

          <line x1="40" y1="70" x2="40" y2="58" stroke="#22c55e" stroke-width="6"/>
          <line x1="80" y1="62" x2="80" y2="46" stroke="#22c55e" stroke-width="6"/>
          <line x1="120" y1="50" x2="120" y2="30" stroke="#22c55e" stroke-width="6"/>
          <line x1="160" y1="42" x2="160" y2="20" stroke="#22c55e" stroke-width="6"/>
          <line x1="200" y1="28" x2="200" y2="12" stroke="#22c55e" stroke-width="6"/>
          <line x1="240" y1="16" x2="240" y2="2" stroke="#22c55e" stroke-width="6"/>
          `
          :
          `
          <polyline
            fill="none"
            stroke="#ef4444"
            stroke-width="4"
            points="
            0,10
            40,18
            80,28
            120,40
            160,52
            200,62
            240,72
            300,82
            "
          />

          <line x1="40" y1="18" x2="40" y2="32" stroke="#ef4444" stroke-width="6"/>
          <line x1="80" y1="28" x2="80" y2="44" stroke="#ef4444" stroke-width="6"/>
          <line x1="120" y1="40" x2="120" y2="56" stroke="#ef4444" stroke-width="6"/>
          <line x1="160" y1="52" x2="160" y2="68" stroke="#ef4444" stroke-width="6"/>
          <line x1="200" y1="62" x2="200" y2="78" stroke="#ef4444" stroke-width="6"/>
          <line x1="240" y1="72" x2="240" y2="84" stroke="#ef4444" stroke-width="6"/>
          `
        }

      </svg>

    </div>

  </div>

  `;

}

function calcular(){

  let home =
  parseFloat(document.getElementById("homeXG").value);

  let away =
  parseFloat(document.getElementById("awayXG").value);

  let odd1 =
  parseFloat(document.getElementById("odd1").value);

  let oddX =
  parseFloat(document.getElementById("oddX").value);

  let odd2 =
  parseFloat(document.getElementById("odd2").value);

  let homeBoost =
  parseFloat(document.getElementById("homeBoost").value) || 0;

  let awayWeak =
  parseFloat(document.getElementById("awayWeak").value) || 0;

  let motivation =
  parseFloat(document.getElementById("motivation").value) || 0;

  if(

    isNaN(home) ||

    isNaN(away) ||

    isNaN(odd1) ||

    isNaN(oddX) ||

    isNaN(odd2)

  ){

    document.getElementById("result").innerHTML =

    `
    <div class="info">
      Preencha os dados principais do jogo e odds.
    </div>
    `;

    return;

  }

  home =
  Math.min(Math.max(home,0.2),4);

  away =
  Math.min(Math.max(away,0.2),4);

  homeBoost =
  Math.min(Math.max(homeBoost,0),0.5);

  awayWeak =
  Math.min(Math.max(awayWeak,0),0.5);

  let adjustedHome =

  home +

  (homeBoost * 0.35) +

  (awayWeak * 0.25) +

  (motivation * 0.20);

  let adjustedAway =

  away -

  (awayWeak * 0.20) -

  (homeBoost * 0.10);

  if(adjustedAway < 0.25){

    adjustedAway = 0.25;

  }

  let p =
  calcProb(adjustedHome,adjustedAway);

  let marketH =
  marketProbability(odd1);

  let marketD =
  marketProbability(oddX);

  let marketA =
  marketProbability(odd2);

  let marketTotal =
  marketH + marketD + marketA;

  marketH /= marketTotal;
  marketD /= marketTotal;
  marketA /= marketTotal;

  let finalH =
  blendProbability(p.pH,marketH);

  let finalD =
  blendProbability(p.pD,marketD);

  let finalA =
  blendProbability(p.pA,marketA);

  let normalized =
  normalizeProbabilities(
    finalH,
    finalD,
    finalA
  );

  let ev1 =
  getEV(normalized.pH,odd1);

  let evX =
  getEV(normalized.pD,oddX);

  let ev2 =
  getEV(normalized.pA,odd2);

  document.getElementById("result").innerHTML =

  `
  <div class="result-grid">

    ${resultBox("CASA (1)",normalized.pH,ev1)}

    ${resultBox("EMPATE (X)",normalized.pD,evX)}

    ${resultBox("VISITANTE (2)",normalized.pA,ev2)}

  </div>

  <div class="info">

    <b>Leitura do gráfico:</b><br><br>

    📈 Verde → Mercado com EV+ encontrado<br>
    📉 Vermelho → Mercado sem valor esperado<br><br>

    Apenas mercados positivos exibem
    porcentagem e edge estatística.

  </div>

  <div class="footer">

    UGR Future PRO • EV Candlestick Engine v3.0

  </div>

  `;

}

</script>

</body>

      </html>
