<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Páginas</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#090d14;
  color:#f4f4f4;
  padding:24px 16px;
}
.container{
  max-width:650px;
  margin:auto;
}
h1{
  text-align:center;
  margin:10px 0 6px;
  font-size:28px;
  color:#d8b45a;
}
.sub{
  text-align:center;
  color:#9ca3af;
  margin-bottom:25px;
}
.lista{
  display:grid;
  gap:12px;
}
a{
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
  color:#fff;
  background:#111824;
  border:1px solid #303947;
  border-radius:14px;
  padding:18px;
  font-size:18px;
  transition:.2s;
}
a:hover{
  transform:translateY(-2px);
  border-color:#d8b45a;
  background:#17202e;
}
.num{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#d8b45a;
  color:#080b10;
  font-weight:bold;
}
.nome{font-weight:bold}
.arquivo{
  display:block;
  margin-top:4px;
  font-size:13px;
  color:#8993a3;
  font-weight:normal;
}
</style>
</head>
<body>
<div class="container">
  <h1>⚜️ CENTRAL DE PÁGINAS</h1>
  <div class="sub">Páginas selecionadas</div>

  <div class="lista">
    <a href="control.html">
      <span class="num">2</span>
      <span class="nome">Control<span class="arquivo">control.html</span></span>
    </a>

    <a href="forte2.html">
      <span class="num">3</span>
      <span class="nome">Forte 2<span class="arquivo">forte2.html</span></span>
    </a>

    <a href="hab.html">
      <span class="num">4</span>
      <span class="nome">Hab<span class="arquivo">hab.html</span></span>
    </a>

    <a href="index.html">
      <span class="num">5</span>
      <span class="nome">Página Inicial<span class="arquivo">index.html</span></span>
    </a>

    <a href="restrito.html">
      <span class="num">12</span>
      <span class="nome">Restrito<span class="arquivo">restrito.html</span></span>
    </a>

    <a href="rico.html">
      <span class="num">13</span>
      <span class="nome">Rico<span class="arquivo">rico.html</span></span>
    </a>
  </div>
</div>
</body>
</html>
