<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>SOBERANO 14.0 • FORTALEZA</title>

<style>

:root{
    --bg:#0b0e12;
    --card:#151a21;
    --card2:#101419;
    --gold:#d6a84f;
    --gold2:#f0c96a;
    --text:#eeeeee;
    --muted:#9da5b2;
    --green:#35e878;
    --red:#ff5050;
    --orange:#ffb84d;
    --border:rgba(214,168,79,.22);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at top,
            rgba(214,168,79,.14),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #090b0f,
            #11151b
        );
    color:var(--text);
    padding:18px 12px 40px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

.card{
    background:linear-gradient(
        145deg,
        #171c23,
        #11151b
    );

    border:1px solid var(--border);

    border-radius:20px;

    padding:22px;

    margin-bottom:16px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);
}

.header{
    text-align:center;
    padding:30px 20px;
}

.coroa{
    font-size:46px;
    margin-bottom:8px;
}

h1{
    color:var(--gold2);
    font-size:29px;
    letter-spacing:2px;
}

.subtitulo{
    color:var(--muted);
    font-size:12px;
    letter-spacing:2px;
    margin-top:5px;
}

.lema{
    margin-top:22px;
    padding:18px;

    border-radius:15px;

    background:#0c1015;

    border:1px solid var(--border);

    color:#ddd;

    line-height:1.6;
}

.lema strong{
    color:var(--gold2);
}

.titulo{
    font-size:18px;
    font-weight:bold;
    color:var(--gold2);
    margin-bottom:15px;
}

label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:7px;
}

select,
input{
    width:100%;

    background:#0c1015;

    color:white;

    border:1px solid rgba(255,255,255,.12);

    border-radius:11px;

    padding:14px;

    font-size:15px;

    outline:none;
}

select:focus,
input:focus{
    border-color:var(--gold);
}

.campo{
    margin-bottom:15px;
}

.campo:last-child{
    margin-bottom:0;
}

.protocol-box{

    margin-top:18px;

    padding:17px;

    border-radius:14px;

    background:#0c1015;

    border:1px solid var(--border);

}

.protocol-titulo{

    color:var(--gold2);

    font-weight:bold;

    margin-bottom:8px;
}

.protocol-text{

    color:#d5d5d5;

    font-size:14px;

    line-height:1.55;
}

button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #b9872f,
            #edc15e
        );

    color:#16120a;

    font-weight:bold;

    cursor:pointer;

    margin-top:12px;

    font-size:15px;
}

button:hover{
    filter:brightness(1.08);
}

.btn-secundario{

    background:#242b34;

    color:#ddd;

    border:1px solid rgba(255,255,255,.1);
}

.pergunta{
    margin-top:16px;
}

.hidden{
    display:none;
}

/* RESULTADO */

.resultado{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.78);

    z-index:1000;

    padding:20px;

    align-items:center;

    justify-content:center;
}
