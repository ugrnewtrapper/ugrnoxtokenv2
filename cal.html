<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIMITE X</title>
<link rel="icon" href="images/logo2.png">
<style>
:root{--bg-main:#0f1216;--bg-card:#151a21;--primary:#1f6feb;--text:#e6e6e6;--muted:#a0a7b4;--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#0c0f14,var(--bg-main));display:flex;justify-content:center;align-items:center;color:var(--text)}
.card{width:92%;max-width:470px;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center}
.logo{width:110px;margin-bottom:15px}h1{color:var(--primary);margin-bottom:20px}
label{font-weight:bold}input{width:100%;padding:14px;margin:10px 0 20px;border-radius:10px;border:1px solid var(--border);background:#0f1216;color:#fff;text-align:center;font-size:20px}
.box{background:#0f1216;border:1px solid var(--border);border-radius:12px;padding:15px;margin-top:15px}
.valor{font-size:30px;font-weight:bold}.verde{color:#38ff74}.vermelho{color:#ff4d4d}
.info{font-size:.92rem;color:var(--muted);margin-top:10px}
button{width:100%;padding:14px;margin-top:10px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}
</style></head><body>
<div class="card">
<img class="logo" src="images/logo2.png"><h1>LIMITE X</h1>
<label>Saldo</label><input type="number" id="saldo" placeholder="Digite seu saldo" oninput="calcular()">

<div class="box"><h2>🍃 Mary Jane (6%)</h2><div id="mary" class="valor vermelho">R$0,00</div></div>

<div class="box">
<h2>🥂 Álcool</h2>
<div class="valor vermelho">BLOQUEADO</div>
<div class="info">Bloqueio permanente desde 09/08/2026.</div>
</div>

<div class="box"><h2>🎯 Limite Diário Bets (1%)</h2><div id="bets" class="valor vermelho">R$0,00</div><div id="msg" class="info"></div></div>

<button onclick="reiniciar()">Reiniciar</button>

<p class="info" style="margin-top:18px">UGRNOXTOKEN • Versão 2.0</p>
</div>

<script>
function calcular(){
let saldo=parseFloat(document.getElementById('saldo').value)||0;
let mary=saldo*0.06,bets=saldo*0.01;
mary.innerHTML
let md=document.getElementById('mary'),bt=document.getElementById('bets'),m=document.getElementById('msg');
md.innerHTML='R$ '+mary.toFixed(2).replace('.',',');
bt.innerHTML='R$ '+bets.toFixed(2).replace('.',',');
md.className='valor '+(mary>=50?'verde':'vermelho');
if(bets>=10){bt.className='valor verde';m.innerHTML='Apostas liberadas. Limite diário: 1% do dinheiro informado.';}
else{bt.className='valor vermelho';m.innerHTML='Apostas bloqueadas. O limite mínimo diário é R$ 10,00.';}
}

function reiniciar(){
document.getElementById('saldo').value='';
calcular();
}

calcular();
</script></body></html>
